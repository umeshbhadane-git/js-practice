<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO DO App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="todo-app">
        
        <h1>Todo App</h1> 
        
        <!-- Add Todo -->
        <form id="todoForm"> 
            <input id="todoInput" 
                   type="text" 
                   placeholder="Enter a todo..." 
                   autocomplete="off">

            <button type="submit">
                Add 
            </button> 

        </form> 

        <!-- Filters -->
        <div class="filters"> 
            <button type="button" 
                    class="filter-btn active" 
                    data-filter="all"> 
                    All 
            </button> 

            <button type="button" 
                    class="filter-btn" 
                    data-filter="active"> 
                    Active 
            </button> 
            
            <button type="button"
                    class="filter-btn" 
                    data-filter="completed"> 
                    Completed 
            </button> 
        </div> 
        
        <!-- Todo List -->
        <ul id="todoList"></ul>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
